# Monitorix drop-in configuration for the amdgpu_top module
# (all data from 'amdgpu_top -J -n 1' JSON output)
#
# Install as /etc/monitorix/conf.d/99-amdgpu_top.conf
# Restart afterwards: systemctl restart monitorix
#
# The module REPLACES the built-in 'amdgpu' module:
# - amdgpu is disabled via <graph_enable>
# - graph_name (from the main config) is overridden with 'amdgpu' swapped
#   for 'amdgpu_top', so the module appears exactly at the old amdgpu
#   position in the WebUI menu and in the 'all graphs' page.
# NOTE: on Monitorix upgrades the default graph_name list may change;
# compare it then with /etc/monitorix/monitorix.conf.

graph_name = system, kern, proc, amdenergy, intelrapl, hptemp, lmsens, gensens, ipmi, ambsens, amdgpu_top, nvidiagpu, nvidia, disk, nvme, fs, zfs, du, net, netstat, tinyproxy, tc, libvirt, process, serv, mail, port, user, ftp, apache, nginx, lighttpd, mysql, pgsql, mongodb, varnish, pagespeed, squid, nfss, nfsc, bind, unbound, ntp, chrony, fail2ban, icecast, raspberrypi, phpapc, memcached, redis, phpfpm, int

<graph_enable>
	amdgpu		= n
	amdgpu_top	= y
</graph_enable>

<graph_title>
	amdgpu_top		= AMD GPU statistics (amdgpu_top JSON)
</graph_title>

<graphs>
	_amdgpu_top1	= GPU usage
	_amdgpu_top2	= Power
	_amdgpu_top3	= Memory usage
	_amdgpu_top4	= GRBM engines
	_amdgpu_top5	= GRBM2 engines
	_amdgpu_top6	= Temperatures
	_amdgpu_top7	= Clocks
	_amdgpu_top8	= Voltage
	_amdgpu_top9	= Fan speed
	_amdgpu_top10	= Media engine usage
</graphs>

<amdgpu_top>
	<list>
		0 = 0
	</list>
	cmd	= amdgpu_top -J -n 1
	no_pc	= n
	use_nan_for_missing_data	= y
	show_current_values		= y
	show_info				= y
	<map>
		0 = Radeon 8060S
	</map>
</amdgpu_top>
